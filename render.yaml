services:
  - type: web
    name: signal-daily
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: nvidia
      - key: AI_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: AI_MODEL
        value: z-ai/glm-5.2
      - key: AI_CHAT_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
