services:
  signal-daily:
    build: .
    command: ["python", "-m", "daily_news.server", "--host", "0.0.0.0", "--port", "8000", "--refresh-hours", "5"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-nvidia}
      AI_BASE_URL: ${AI_BASE_URL:-https://integrate.api.nvidia.com/v1}
      AI_MODEL: ${AI_MODEL:-z-ai/glm-5.2}
    volumes:
      - signal-daily-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  signal-daily-data:
