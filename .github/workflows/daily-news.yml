name: Daily bilingual news

on:
  schedule:
    # Roughly every five hours (UTC): 00:15, 05:15, 10:15, 15:15, 20:15.
    - cron: "15 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-daily-refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m daily_news
      - uses: actions/upload-artifact@v4
        with:
          name: daily-news-${{ github.run_id }}
          path: output/
          retention-days: 30
      - name: Commit report
        run: |
          git config user.name "daily-news-bot"
          git config user.email "daily-news-bot@users.noreply.github.com"
          git add output/
          git add web/data/
          git add data/
          git diff --cached --quiet || git commit -m "news: daily bilingual brief"
          git push
